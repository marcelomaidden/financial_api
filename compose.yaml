# MySQL local para desenvolvimento. As senhas vêm de variáveis de ambiente
# (ou de um arquivo .env nesta pasta, que está no .gitignore).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: financial_api
      MYSQL_USER: ${MYSQL_USER:-financial_api}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-teste}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
