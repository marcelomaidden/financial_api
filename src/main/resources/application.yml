spring:
  application:
    name: financial-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Acesso à API. Chave em branco desliga a verificação; o perfil prod exige a chave.
# Origens de CORS: lista separada por vírgula, com esquema e sem barra no final.
app:
  access:
    api-key: ${APP_API_KEY:}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

pluggy:
  base-url: https://api.pluggy.ai
  connect-timeout: 5s
  read-timeout: 30s
