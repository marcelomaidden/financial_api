# Perfil de produção: tudo vem de variáveis de ambiente, sem valores padrão.
spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

# APP_API_KEY é obrigatória (a aplicação não inicia sem ela). Sem
# APP_CORS_ALLOWED_ORIGINS, nenhuma origem de navegador é permitida.
app:
  access:
    api-key: ${APP_API_KEY:}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

pluggy:
  owners:
    - name: marcelo
      client-id: ${PLUGGY_MARCELO_CLIENT_ID:}
      client-secret: ${PLUGGY_MARCELO_CLIENT_SECRET:}
      item-ids: ${PLUGGY_MARCELO_ITEM_IDS:}
    - name: luana
      client-id: ${PLUGGY_LUANA_CLIENT_ID:}
      client-secret: ${PLUGGY_LUANA_CLIENT_SECRET:}
      item-ids: ${PLUGGY_LUANA_ITEM_IDS:}
